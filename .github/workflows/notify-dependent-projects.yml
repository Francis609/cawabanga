name: Notify dependent projects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ vars.UPDATE_TARGETS != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped dispatch when its token is not configured
        if: ${{ env.CROSS_REPO_TOKEN == '' }}
        run: echo "Cross-repository dispatch skipped; configure the CROSS_REPO_TOKEN secret first."
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      - name: Dispatch update event to configured repositories
        if: ${{ env.CROSS_REPO_TOKEN != '' }}
        uses: actions/github-script@v9.0.0
        env:
          UPDATE_TARGETS: ${{ vars.UPDATE_TARGETS }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.CROSS_REPO_TOKEN }}
          script: |
            const targets = JSON.parse(process.env.UPDATE_TARGETS);
            if (!Array.isArray(targets) || targets.some(target => !/^[^/]+\/[^/]+$/.test(target))) {
              throw new Error('UPDATE_TARGETS must be a JSON array of owner/repository names.');
            }
            if (targets.length && !process.env.CROSS_REPO_TOKEN) {
              throw new Error('Set the CROSS_REPO_TOKEN repository secret to dispatch cross-repository events.');
            }
            for (const target of targets) {
              const [owner, repo] = target.split('/');
              await github.rest.repos.createDispatchEvent({
                owner,
                repo,
                event_type: 'cawabanga_update',
                client_payload: {
                  source_repository: context.repo.owner + '/' + context.repo.repo,
                  source_ref: context.ref,
                  source_sha: context.sha,
                  source_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`
                }
              });
              core.info(`Sent cawabanga_update to ${target}`);
            }
