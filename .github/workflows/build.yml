name: Build Cawabanga

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Api/CawaBanga.Api.csproj
      - name: Build
        run: dotnet build Api/CawaBanga.Api.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test Api.Tests/Api.Tests.csproj --configuration Release
